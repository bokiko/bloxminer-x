name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-22.04
    env:
      # Ubuntu 22.04's apt jq package is 1.6; some of h-stats.sh's own `jq -e` validators are written to behave
      # correctly on BOTH 1.6 and 1.7+ (see h-stats.sh's own header for the exact empty-input quirk) - this is
      # the one job that actually exercises jq 1.6, matching a real Hive rig's own OS.
      BLOX_CI: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: apt dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 5
          done
          sudo apt-get install -y -qq shellcheck jq netcat-openbsd
      - name: syntax
        run: for f in bloxminer-x/*.sh build/*.sh tests/*/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -s bash bloxminer-x/h-config.sh bloxminer-x/h-run.sh bloxminer-x/h-stats.sh build/*.sh tests/*/*.sh
      - name: HiveOS script tests
        run: tests/hive/test_hive_scripts.sh
      - name: bloxsense tests
        run: tests/bloxsense/run_tests.sh
      - name: build package provenance tests
        run: tests/build/test_package_provenance.sh

  engine:
    # Builds the real xmrig/bloxsense binaries with the exact release recipe (build/build.sh itself refuses to
    # run as anything but root/Ubuntu 22.04 - see its own header - so this runs under sudo, then hands ownership
    # back to the runner user before anything downstream, including upload-artifact, needs to read the result).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: release build (same script as the published binary, as root)
        run: sudo build/build.sh out
      - name: hand build output back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" out
      # xmrig/bloxsense are completely unmodified upstream XMRig (only the 0%-donate patch touches donate.h) -
      # there is no custom branding/version string compiled into either binary to check here, unlike BloxMiner
      # v3's RandomX engine; `--version` alone proves the binary runs at all and is still the pinned release.
      - name: xmrig runs and reports the pinned upstream version
        run: |
          out/xmrig --version | tee /tmp/xmrig-version.out
          grep -q "^XMRig 6.26.0" /tmp/xmrig-version.out || { echo "xmrig --version did not report the pinned 6.26.0"; exit 1; }
          # the statically linked deps really are the versions build.sh pins (not whatever a header search found)
          for d in UV:libuv HWLOC:hwloc SSL:OpenSSL; do
            v=$(sed -n "s/^${d%%:*}_VER=//p" build/build.sh)
            grep -qx "${d#*:}/$v" /tmp/xmrig-version.out || { echo "xmrig --version does not report ${d#*:}/$v (build.sh pin)"; exit 1; }
          done
      - name: bloxsense exists and runs
        run: |
          test -x out/bloxsense
          out/bloxsense --json | head -c 1 | grep -q '{'
      - name: build.provenance has the pinned fields
        run: |
          for f in upstream upstream_tag upstream_commit patch_sha256 xmrig_sha256 bloxsense_sha256 \
                   dep.libuv.version dep.libuv.sha256 dep.hwloc.version dep.hwloc.sha256 dep.openssl.version dep.openssl.sha256; do
            grep -q "^$f=" out/build.provenance || { echo "out/build.provenance: missing $f="; exit 1; }
          done
      - name: upload outdir (for package-provenance-real)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bloxminer-x-out
          path: out

  under-load-real:
    # The under-load suite, with its case 2 run against the REAL xmrig + bloxsense the engine job just built.
    # It used to run in the `scripts` job, which never had those binaries, so case 2 always printed SKIP on
    # CI - BLOX_REQUIRE_REAL_ENGINE=1 makes a missing binary (or a bloxsense fixture fallback) a FAIL instead.
    needs: [engine]
    runs-on: ubuntu-22.04
    env:
      BLOX_CI: "1"
      BLOX_REQUIRE_REAL_ENGINE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bloxminer-x-out
          path: out
      - name: restore the executable bit (artifact upload/download does not always preserve it)
        run: chmod +x out/xmrig out/bloxsense
      - name: apt dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 5
          done
          sudo apt-get install -y -qq jq netcat-openbsd
      - name: HiveOS script tests (under load, real engine)
        run: BLOX_XMRIG_BIN="$PWD/out/xmrig" BLOX_BLOXSENSE_BIN="$PWD/out/bloxsense" tests/hive/test_under_load.sh

  package-provenance-real:
    # Packages the REAL build output above (never the `scripts` job's own synthetic fixture) with the real
    # build/package.sh, and proves the resulting artefacts are exactly what they claim to be - closing the gap
    # a synthetic-binary fixture alone cannot: a broken XMRig compile, a donate0.patch that no longer applies
    # cleanly, a dependency build regression, or a HELPERS/provenance drift could all reach main unnoticed
    # otherwise.
    needs: [engine]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bloxminer-x-out
          path: out
      - name: restore the executable bit (artifact upload/download does not always preserve it)
        run: chmod +x out/xmrig out/bloxsense
      - name: package the real build output
        run: build/package.sh out pkgout
      - name: both artefacts exist and SHA256SUMS matches them
        run: |
          VER=$(sed -n 's/^CUSTOM_VERSION=//p' bloxminer-x/h-manifest.conf)
          test -f "pkgout/bloxminer-x-$VER.tar.gz"
          test -f "pkgout/bloxminer-x-$VER-src.tar.gz"
          (cd pkgout && sha256sum -c <(grep -E "^[0-9a-f]+  bloxminer-x-$VER(-src)?\.tar\.gz\$" SHA256SUMS))
      - name: binary package contains the real build artefacts, matching sha256
        run: |
          VER=$(sed -n 's/^CUSTOM_VERSION=//p' bloxminer-x/h-manifest.conf)
          W=$(mktemp -d); tar -xzf "pkgout/bloxminer-x-$VER.tar.gz" -C "$W"
          [[ $(sha256sum out/xmrig | cut -d' ' -f1) == $(sha256sum "$W/bloxminer-x/xmrig" | cut -d' ' -f1) ]]
          [[ $(sha256sum out/bloxsense | cut -d' ' -f1) == $(sha256sum "$W/bloxminer-x/bloxsense" | cut -d' ' -f1) ]]
      - name: source package contains the patched xmrig tree, donate0.patch already applied
        run: |
          VER=$(sed -n 's/^CUSTOM_VERSION=//p' bloxminer-x/h-manifest.conf)
          W=$(mktemp -d); tar -xzf "pkgout/bloxminer-x-$VER-src.tar.gz" -C "$W"
          SD="$W/bloxminer-x-$VER-src"
          test -d "$SD/xmrig" && test ! -d "$SD/xmrig/.git"   # already patched, re-clone not required to inspect it
          grep -q "constexpr const int kDefaultDonateLevel = 0;" "$SD/xmrig/src/donate.h"
          grep -q "constexpr const int kMinimumDonateLevel = 0;" "$SD/xmrig/src/donate.h"
